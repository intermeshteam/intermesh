services:
  # 1. Le Hub Nexus (Cœur du Réseau)
  nexus-hub:
    build:
      context: .
      dockerfile: docker/Dockerfile.hub
    container_name: nexus-hub
    ports:
      - "8765:8765"
    environment:
      # Le Hub écrit sa clé de signature JWT et sa base d'état dans
      # NEXUS_HOME. Sans volume, `docker compose down && up` régénérerait
      # la clé (invalidant tous les tokens) et effacerait identités,
      # tâches et journal d'audit.
      - NEXUS_HOME=/data/nexus
      # En production, préférez injecter la clé sans jamais l'écrire sur
      # disque (le volume ci-dessous devient alors inutile) :
      #   NEXUS_HUB_SECRET=${NEXUS_HUB_SECRET}
      # Générez-la avec :
      #   python3 -c "import secrets; print(secrets.token_hex(32))"
      # Le volume reste nécessaire pour la base d'état.
    volumes:
      - nexus-hub-data:/data/nexus
    networks:
      - nexus-net
    restart: unless-stopped

  # 2. Le Dashboard Mission Control (Interface Web)
  nexus-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: nexus-dashboard
    ports:
      - "8080:8080"
    networks:
      - nexus-net
    depends_on:
      - nexus-hub
    restart: unless-stopped

  # 3. Agent Worker 1 (Calculateur)
  agent-calculator:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: nexus-agent-calculator
    environment:
      - AGENT_SCRIPT=agent_b.py
      - HUB_URL=ws://nexus-hub:8765
    networks:
      - nexus-net
    depends_on:
      - nexus-hub
    restart: unless-stopped

  # 4. Agent Worker 2 (Traducteur)
  agent-translator:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: nexus-agent-translator
    environment:
      - AGENT_SCRIPT=agent_c.py
      - HUB_URL=ws://nexus-hub:8765
    networks:
      - nexus-net
    depends_on:
      - nexus-hub
    restart: unless-stopped

volumes:
  # Conserve la clé de signature JWT et la base d'état (identités, tâches,
  # journal d'audit) entre les recréations du conteneur.
  nexus-hub-data:

networks:
  nexus-net:
    driver: bridge
