[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intermesh"
version = "0.4.5"
description = "Universal coordination protocol for AI agents — E2E encrypted, cross-language, federated"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "InterMesh Protocol Authors"},
]
keywords = [
    "ai",
    "agents",
    "multi-agent-systems",
    "protocol",
    "coordination",
    "e2e-encryption",
    "distributed-systems",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "websockets>=12.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]

# Optionnel : le Hub fonctionne en SQLite sans rien de plus. PostgreSQL
# n'est nécessaire que pour découpler l'état de la machine.
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

# La couche de paiement HTTP 402. Le noyau (prix, défi, preuve, registre)
# et le relais n'ont besoin de rien : le relais tourne sur `http.server`
# de la bibliothèque standard, précisément pour qu'un registre reste
# installable partout. Ces extras ne servent qu'aux adaptateurs.
fastapi = ["fastapi>=0.110"]
http = ["httpx>=0.27"]

# La couche d'assurance : le proxy et le vérificateur tournent sur la
# bibliothèque standard. PyYAML ne sert qu'à lire une politique en YAML —
# le JSON fonctionne sans rien installer, pour qu'un vérificateur reste
# exécutable partout.
assurance = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/intermeshteam/intermesh"
Repository = "https://github.com/intermeshteam/intermesh"
Documentation = "https://github.com/intermeshteam/intermesh/tree/main/docs"
Issues = "https://github.com/intermeshteam/intermesh/issues"

[project.scripts]
intermesh = "intermesh.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intermesh*"]

# La console d'exploitation voyage avec le paquet. Sans cela, `intermesh
# console` servait un chemin codé en dur vers l'arborescence du
# développeur : la commande annonçait « actif » puis répondait 404 chez
# tout le monde sauf lui.
[tool.setuptools.package-data]
# Récursif, et non `*.html` : l'essentiel de la console vit dans `_next/`,
# et un motif non récursif laissait les 32 fichiers JavaScript dehors —
# la page se serait chargée sans son application.
"intermesh.console" = ["**/*"]
